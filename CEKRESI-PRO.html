body {

  color: #172033;
}

header {
  background: linear-gradient(135deg, #0755d9, #123a9b);

  padding: 35px 15px;

header h1 {
  margin: 0;

header p {

h2 {

label {

  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: .8;
}

.secondary {
  background: #e8efff;

}

.result {
  display: none;

}

.note {

  font-size: 13px;
  line-height: 1.6;
}

.timeline {
  border-left: 3px solid #cbdcff;
  padding-left: 18px;
  margin: 20px 0 10px 7px;
}

  position: relative;
  margin-bottom: 22px;
}

  top: 3px;
  width: 12px;
  height: 12px;
  background: #0755d9;
  border-radius: 50%;
}
